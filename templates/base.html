
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo List</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand" href="/">My Todo List</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>


      </ul>
    </div>

  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div class="container my-4">
    <form action="/" method="POST">
  <div class="mb-3">
      <h2>Add a Todo</h2>
    <label for="title" class="form-label">Todo Task</label>
    <input type="text" class="form-control"name="title" id="title" aria-describedby="emailHelp">

  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Task Description</label>
    <input type="text" class="form-control" name="description" id="description">
  </div>
  <button type="submit" class="btn btn-outline-secondary">Submit</button>
</form>
</div>
<div class="container my-4">
    <h2>Your Todos</h2>
    
    {% if alltodo|length == 0 %}
      no record found
      {% else %}
      <table class="table">
    <thead>
    <tr>
      <th scope="col">SNo</th>
      <th scope="col">Task</th>
      <th scope="col">Description</th>
      <th scope="col">Time</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    {% for todo in alltodo %}
      <tr>
      <th scope="row">{{loop.index}}</th>
      <td>{{todo.task}}</td>
      <td>{{todo.desc}}</td>
      <td>{{todo.time}}</td>
      <td><a href="/update/{{todo.sno}}" type="button" class="btn btn-outline-secondary">Update</a></td>
      <td><a href="/delete/{{todo.sno}}" type="button" class="btn btn-outline-danger">Delete</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
  {% endif %}

  
</div>
</body>
</html>
